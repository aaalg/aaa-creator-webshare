name: AAA • Webshare Harvester

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4,16 * * *"

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Private Engine Core
        uses: actions/checkout@v4
        with:
          repository: "aaa2160/aaa-domain-email-proxy-hub"
          token: ${{ secrets.GH_PAT }}
          path: "engine"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          cd engine
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt patchright
          python3 -m patchright install --with-deps chromium

      - name: Execute Autonomous Provisioner
        env:
          HEADLESS: "1"
          USE_PROXY: "1"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_EMAIL_BOT_TOKEN: ${{ secrets.TELEGRAM_EMAIL_BOT_TOKEN }}
          TELEGRAM_CONTROLLER_BOT_TOKEN: ${{ secrets.TELEGRAM_CONTROLLER_BOT_TOKEN }}
          TELEGRAM_USER_CHAT_ID: ${{ secrets.TELEGRAM_USER_CHAT_ID }}
          TELEGRAM_VAULT_CHANNEL_ID: ${{ secrets.TELEGRAM_VAULT_CHANNEL_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
          WEBSHARE_API_KEY: ${{ secrets.WEBSHARE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd engine
          python3 webshare_account_creator.py
